# Camunda override – layer on top of docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.camunda.yml up --build
#
# NOTE: Camunda integration is not yet implemented in the application code.
#       This file provisions the Camunda 8 (Zeebe) stack so it is ready
#       when implementation begins.
#
# Ports exposed:
#   26500  – Zeebe gateway gRPC   (Python workers connect here)
#   8080   – Operate UI           →  http://localhost:8080
#   9600   – Zeebe metrics

services:
  zeebe:
    image: camunda/zeebe:8.5.5
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
    ports:
      - "26500:26500"  # gRPC gateway
      - "9600:9600"    # metrics
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  operate:
    image: camunda/operate:8.5.5
    ports:
      - "8080:8080"    # Operate UI
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  # Add Camunda/Zeebe env vars to the existing backend service
  backend:
    environment:
      - ZEEBE_ADDRESS=zeebe:26500
    depends_on:
      zeebe:
        condition: service_healthy

volumes:
  elasticsearch_data:
